name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest --cov=agentablate --cov-report=term-missing --cov-fail-under=90

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install build
      - run: python -m build
      - name: Verify wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              assert "agentablate/templates/report.html.j2" in archive.namelist()
          PY
      - name: Install and smoke-test wheel
        run: |
          python -m venv /tmp/agentablate-wheel
          /tmp/agentablate-wheel/bin/python -m pip install dist/*.whl
          /tmp/agentablate-wheel/bin/agentablate --help
          git -C examples/fake-ablation/fixture init
          git -C examples/fake-ablation/fixture config user.name AgentAblate
          git -C examples/fake-ablation/fixture config user.email agentablate@example.invalid
          git -C examples/fake-ablation/fixture add README.md
          git -C examples/fake-ablation/fixture commit -m "Initial fixture"
          /tmp/agentablate-wheel/bin/agentablate doctor \
            examples/fake-ablation/agentablate.yaml

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install build
      - run: python -m build
      - name: Install wheel and run static example
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "agentablate-wheel"
          python -m venv $venv
          $python = Join-Path $venv "Scripts/python.exe"
          $agentablate = Join-Path $venv "Scripts/agentablate.exe"
          $wheel = Get-ChildItem "dist/*.whl" | Select-Object -First 1
          & $python -m pip install $wheel.FullName
          & $agentablate --help
          git -C examples/fake-ablation/fixture init
          git -C examples/fake-ablation/fixture config user.name AgentAblate
          git -C examples/fake-ablation/fixture config user.email agentablate@example.invalid
          git -C examples/fake-ablation/fixture add README.md
          git -C examples/fake-ablation/fixture commit -m "Initial fixture"
          & $agentablate doctor examples/fake-ablation/agentablate.yaml
          & $agentablate run examples/fake-ablation/agentablate.yaml
          & $agentablate report examples/fake-ablation/.agentablate/results.sqlite3 `
            --format markdown --output "$env:RUNNER_TEMP/agentablate-report.md"
